[pytest]
# Pytest configuration for AI-Driven API Fuzzer

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Logging and output
log_cli = true
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG

# Coverage
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=.
    --cov-report=html:tests/coverage
    --cov-report=term-missing:skip-covered
    --cov-exclude=tests/*
    --cov-exclude=venv/*

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    llm: Tests involving LLM API calls
    mock: Tests using mocks

# Timeout (prevents hanging tests)
timeout = 30

# Asyncio mode
asyncio_mode = auto
